# Easy config reload. tmux-themepack uses "set if unset" for its palette,
# so clear only its cached options before sourcing the config again.
bind r run-shell 'tmux show-options -g | cut -d " " -f 1 | grep -E "^@(theme|themepack|powerline)(-|$)" | while IFS= read -r option; do tmux set-option -gu "$option"; done; tmux source-file ~/.config/tmux/tmux.conf; tmux display-message "~/.config/tmux/tmux.conf sourced!"'
set -g default-terminal "screen-256color"

# Send prefix
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Open new windows in the active pane's current directory.
bind c new-window -c "#{pane_current_path}"

set -g mode-keys vi 

unbind %
bind h split-window -h -c "#{pane_current_path}"

unbind '"'
bind v split-window -v -c "#{pane_current_path}"

bind -r m resize-pane -Z


bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

# tpm plugin
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'janoamaral/tokyo-night-tmux'
set -g @tokyo-night-tmux_window_id_style none
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_right_widgets "git"
set -g status-position top
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set -ga terminal-overrides ',xterm-256color:Tc'
 
# Mouse mode
setw -g mouse on
 
# Set easier window split keys

# Fast toggle (normally prefix-l).
bind Tab last-window
 
# Automatically renumber window numbers on closing a pane (tmux >= 1.7).
set -g renumber-windows on 
set -g status on

# Start window and pane numbering at 1, (0 is too hard to reach).
set -g base-index 1
set -g pane-base-index 1
set -g status-justify left

# Don't wait for an escape sequence after seeing C-a.
set -s escape-time 0

# Ghostty/cmux start tmux via `login ... bash --noprofile --norc`, so the server
# inherits a bare PATH and plugin scripts can't find `tmux` or Homebrew `git`.
# Fix the server environment before tpm runs anything.
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:$PATH"

# Initialize TMUX plugin manager before applying theme overrides.
run '~/.tmux/plugins/tpm/tpm'

# Keep Tokyo Night's prefix indicator, but show the user instead of the session.
set -g status-left '#[fg=#2A2F41,bg=#7aa2f7,bold] #{?client_prefix,#[bg=#7aa2f7]󰠠 ,#[dim]󰤂 }#[bold,nodim]#{user} '

# Report the current directory name as the terminal (Ghostty tab) title
set -g set-titles on
set -g set-titles-string "#{b:pane_current_path}"
